name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # Real-Chromium SSRF tests (test/ssrf-policy.test.ts) must run here, not be skipped.
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx vitest run --reporter=verbose test/ssrf-policy.test.ts
        env: { REQUIRE_CHROMIUM: "1" }
      # Full suite through the count gate: fails on any skipped/todo test or if fewer than
      # test/EXPECTED_TEST_COUNT tests executed (catches unmatched/missing test files).
      - run: node scripts/test-gate.mjs
        env: { REQUIRE_CHROMIUM: "1" }

  # The aliyun run_cli preset must match the REAL aliyun CLI (issue #34). No credentials: only `--help` is run.
  # Versions and checksums are pinned for reproducibility; a CLI or plugin update needs a bump of all four values
  # below (take the checksums from the release's SHASUMS256.txt and the CLI's plugin index).
  aliyun-cli:
    runs-on: ubuntu-latest
    env:
      ALIYUN_CLI_VERSION: "3.5.1"
      ALIYUN_CLI_SHA256: "3a9a45b9c7899228074135612d2b7ebbf32abb97826d825787cb454cd3011bdc"
      SLS_PLUGIN_VERSION: "0.9.6"
      SLS_PLUGIN_SHA256: "39fd654844c5c99124d209e8b8da664b930fc60343084f412c7fc86832095286"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Install official aliyun CLI (pinned, checksum verified)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aliyun" && cd "$RUNNER_TEMP/aliyun"
          curl -fsSLo cli.tgz "https://github.com/aliyun/aliyun-cli/releases/download/v${ALIYUN_CLI_VERSION}/aliyun-cli-linux-${ALIYUN_CLI_VERSION}-amd64.tgz"
          echo "${ALIYUN_CLI_SHA256}  cli.tgz" | sha256sum -c -
          tar xzf cli.tgz && echo "$RUNNER_TEMP/aliyun" >> "$GITHUB_PATH"
          curl -fsSLo sls.tar.gz "https://aliyuncli.alicdn.com/plugins/pkgs/aliyun-cli-sls/${SLS_PLUGIN_VERSION}/aliyun-cli-sls-linux-amd64.tar.gz"
          echo "${SLS_PLUGIN_SHA256}  sls.tar.gz" | sha256sum -c -
          ./aliyun plugin install --package "$PWD/sls.tar.gz"
          ./aliyun version && ./aliyun plugin list
          test ! -e ~/.aliyun/config.json
      - run: node scripts/check-aliyun-preset.mjs

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: docker compose version
      - run: bash examples/run-e2e.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: walkthrough-html
          path: e2e-output/
          if-no-files-found: error

  # Fresh clone → `npm ci && npm run demo`, exactly what the README tells a newcomer to do.
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      # mongodb-memory-server downloads its mongod binary once (at npm ci); cache it so the demo itself is offline.
      - name: Cache mongod binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run demo | tee demo.log
      - name: Assert the audit page (verdict sentence, chain, sign-off on the first screen)
        run: |
          html="$(sed -n 's/^完整报告（浏览器打开）：//p' demo.log)"
          node examples/assert-trace-chain.mjs "${html%index.html}walkthrough.json"
          grep -q '发现 1 个问题' demo.log
          mkdir -p demo-output && cp "$html" demo-output/
      # --docker: throwaway container on a random loopback port; must be gone afterwards.
      - run: npm run demo -- --docker
      - run: test -z "$(docker ps -aq --filter name=walkthrough-demo-mongo)"
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: demo-audit-page, path: demo-output/, if-no-files-found: warn }
