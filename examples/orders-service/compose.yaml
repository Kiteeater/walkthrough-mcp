services:
  app:
    image: node:20-alpine
    working_dir: /app
    command: ["node", "server.js"]
    volumes:
      - ./:/app:ro
    ports:
      # host port chosen per run by the e2e script (OS-assigned free port), loopback only
      - "127.0.0.1:${PORT:?PORT must be set (free host port)}:3000"
    environment:
      DEMO_API_KEY: ${DEMO_API_KEY:-}
      DEMO_HEALTH_TOKEN: ${DEMO_HEALTH_TOKEN:-}
